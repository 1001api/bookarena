version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bookarena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: bookarena
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./internal/database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bookarena"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookarena-app
    restart: unless-stopped
    ports:
      - "8181:8181"
    environment:
      # Server
      PORT: 8181
      
      # Database
      DATABASE_URL: postgres://admin:admin@postgres:5432/bookarena?sslmode=disable
      
      # App
      APP_DOMAIN: localhost
      ALLOWED_DOMAINS: "['1001api.com', 'localhost']"
      CLIENT_DOMAIN: http://localhost:5173
      
      # Security Keys (CHANGE THESE IN PRODUCTION!)
      COOKIE_ENC_KEY: LKpCdFfhnGE6azxA9iJhpDJCZU1Q5adj
      ENC_KEY: xWoKBZwCCOPgeIyH8Bf678YqZwuzEBDa
      
      # JWT
      JWT_EXPIRY: 60
      JWT_REFRESH_EXPIRY: 4320
      JWT_SECRET: nwxiN005nw1UONh9srxeHrRiqx7kLD6NKeEImATxjZR7l2fTjk
      
      # Root User
      ROOT_EMAIL: root@1001api.com
      ROOT_USERNAME: root
      ROOT_PASSWORD: 'Pass123!@#'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8181/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local
